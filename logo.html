<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
        }

        .logo-img {
            position: absolute;
            /* COLOQUE UM NÚMERO NEGATIVO AQUI PARA SUBIR MAIS */
            top: -15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%;
            height: auto;
            max-width: 120px; 
            object-fit: contain;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5)); 
        }
    </style>
</head>
<body>
    <img src="logo.png" class="logo-img" alt="Logo do Servidor">
</body>
</html>
