<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            touch-action: none; 
            user-select: none;
        }

        .logo-img {
            position: absolute;
            top: 0px; /* Cola a imagem no topo exato */
            left: 50%; /* Joga a imagem pro meio da tela */
            transform: translateX(-50%); /* Ajuste fino pra ficar 100% centralizado */
            width: 100%;
            height: auto;
            max-width: 120px; /* Tamanho máximo da logo */
            object-fit: contain;
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5)); 
        }
    </style>
</head>
<body>
    <img src="logo.png" class="logo-img" alt="Logo do Servidor">
</body>
</html>
