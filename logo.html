<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            justify-content: center; /* Centraliza na horizontal */
            align-items: center; /* Centraliza na vertical dentro do espaço do browser */
            touch-action: none; /* Trava o dedo */
            user-select: none;
        }

        .logo-img {
            width: 100%;
            height: auto;
            max-width: 120px; /* Tamanho da logo, altere se achar pequena/grande */
            object-fit: contain;
            /* Efeito opcional: uma sombrinha leve pra destacar a logo no céu do jogo */
            filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5)); 
        }
    </style>
</head>
<body>
    <img src="logo.png" class="logo-img" alt="Logo do Servidor">
</body>
</html>
