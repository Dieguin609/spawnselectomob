<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <title>SkyPixel - Selecionar Spawn</title>
</head>
<body>
    <div class="overlay"></div>
    
    <header class="main-header">
        <h1>ESCOLHA O LOCAL QUE<br><span>VOCÊ VAI SPAWNAR</span></h1>
        <div class="accent-line"></div>
    </header>

    <main class="container">
        <section class="spawn-grid">
            <div class="spawn-card">
                <div class="image-box">
                    <img src="ultima.jpg">
                    <div class="img-overlay"></div>
                </div>
                <div class="content">
                    <h2>ÚLTIMA POSIÇÃO</h2>
                    <p>Continue sua jornada de onde você parou.</p>
                    <button class="btn-spawn" onclick="spawnUltima()">SPAWNAR</button>
                </div>
            </div>

            <div class="spawn-card">
                <div class="image-box">
                    <img src="aeroporto.jpg">
                    <div class="img-overlay"></div>
                </div>
                <div class="content">
                    <h2>AEROPORTO LS</h2>
                    <p>Desembarque no terminal principal da cidade.</p>
                    <button class="btn-spawn" onclick="spawnAeroporto()">SPAWNAR</button>
                </div>
            </div>

            <div class="spawn-card">
                <div class="image-box">
                    <img src="estacione.jpg">
                    <div class="img-overlay"></div>
                </div>
                <div class="content">
                    <h2>ESTACIONAMENTO 1</h2>
                    <p>Região central, próximo aos comércios.</p>
                    <button class="btn-spawn" onclick="spawnEstac1()">SPAWNAR</button>
                </div>
            </div>

            <div class="spawn-card">
                <div class="image-box">
                    <img src="estacione.jpg">
                    <div class="img-overlay"></div>
                </div>
                <div class="content">
                    <h2>ESTACIONAMENTO 2</h2>
                    <p>Zona sul, ideal para quem busca agilidade.</p>
                    <button class="btn-spawn" onclick="spawnEstac2()">SPAWNAR</button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
